services:
  db:
    image: postgres:18-alpine
    volumes:
      - /opt/videosvoley/postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_NAME:-volleyvideos}
      POSTGRES_USER: ${DB_USER:-volleyuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-volleypass}
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - app-network

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - /opt/videosvoley/media:/app/media
      - /opt/videosvoley/static:/app/staticfiles
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=postgresql://${DB_USER:-volleyuser}:${DB_PASSWORD:-volleypass}@db:5432/${DB_NAME:-volleyvideos}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://redis:6379/1}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/voley-474111-a4a6b029e20b.json
      - SENTRY_RELEASE=${GIT_SHA:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - app-network

  celery:
    build: .
    command: celery -A config worker -l info --pool=solo
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-volleyuser}:${DB_PASSWORD:-volleypass}@db:5432/${DB_NAME:-volleyvideos}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://redis:6379/1}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/voley-474111-a4a6b029e20b.json
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - MALLOC_TRIM_THRESHOLD_=100
      - SENTRY_RELEASE=${GIT_SHA:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    depends_on:
      - db
      - redis
      - web
    restart: unless-stopped
    networks:
      - app-network

  celery-beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-volleyuser}:${DB_PASSWORD:-volleypass}@db:5432/${DB_NAME:-volleyvideos}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://redis:6379/1}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/voley-474111-a4a6b029e20b.json
      - SENTRY_RELEASE=${GIT_SHA:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    depends_on:
      - db
      - redis
      - web
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/videosvoley/static:/app/staticfiles:ro
      - /opt/videosvoley/media:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - app-network
      - webproxy

  certbot:
    image: certbot/dns-ovh
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot/ovh.ini:/opt/ovh.ini:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  webproxy:
    external: true
