{% load i18n %}
<div class="bg-surface rounded-3xl border border-line p-4 sm:p-6">
    <form method="get" class="flex flex-col sm:flex-row items-end gap-3 sm:gap-4">
        <input type="hidden" name="season" value="{{ selected_season }}">
        <div class="w-full sm:flex-1">
            <label for="league" class="block text-sm font-medium text-ink mb-1">{% trans "Liga" %}</label>
            <select name="league" id="league" class="w-full px-3 py-2 border border-line bg-surface text-ink rounded-xl focus:ring-2 focus:ring-accent focus:border-transparent text-sm sm:text-base">
                <option value="">{% trans "Todas las ligas" %}</option>
                {% for l in leagues %}
                    <option value="{{ l.id }}" {% if selected_league_id == l.id|stringformat:"s" %}selected{% endif %}>{{ l.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="w-full sm:w-auto px-4 py-2 bg-csj-purple-dark hover:opacity-90 text-white rounded-full text-sm font-medium transition touch-manipulation">{% trans "Filtrar" %}</button>
    </form>
</div>
