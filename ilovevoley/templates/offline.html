{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión | I Love Voley</title>
    <link rel="icon" type="image/png" href="{% static 'images/icons/icon-192.png' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="{% static 'js/csp_actions.js' %}"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 via-yellow-50 to-purple-100 min-h-screen flex items-center justify-center p-4">
    <main class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 border-t-4 border-csj-purple text-center">
        <!-- Logo -->
        <div class="mb-6 flex justify-center">
            <img src="{% static 'images/logo_app.png' %}" alt="I Love Voley" class="h-14 sm:h-16 w-auto object-contain">
        </div>

        <!-- Icono sin conexión -->
        <div class="w-16 h-16 sm:w-20 sm:h-20 mx-auto mb-5 rounded-full bg-purple-100 flex items-center justify-center text-csj-purple">
            <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L3 3m5.636 5.636a9 9 0 0112.728 0M12 12l.01.01M8.464 8.464a5 5 0 017.072 0m-7.072 0l2.829 2.829m0 0a2 2 0 102.828 2.828M1.05 1.05l21.9 21.9" />
            </svg>
        </div>

        <!-- Mensaje principal -->
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">Sin conexión a internet</h1>
        <p class="text-gray-600 text-sm sm:text-base mb-6">
            No es posible conectar con el servidor. Revisa tu conexión Wi-Fi o datos móviles para continuar navegando.
        </p>

        <!-- Botón reintentar -->
        <div class="space-y-3">
            <button type="button"
                    data-action="reload"
                    class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 bg-csj-purple hover:bg-csj-purple-dark text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-csj-purple focus:ring-offset-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Reintentar</span>
            </button>
        </div>

        <div class="mt-6 pt-5 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-500">
                I Love Voley · Plataforma de Voleibol
            </p>
        </div>
    </main>
</body>
</html>
