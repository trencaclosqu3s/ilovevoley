services:
  db:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=volleyvideos
      - POSTGRES_USER=volleyuser
      - POSTGRES_PASSWORD=volleypass
    ports:
      - "${DEV_DB_PORT:-5434}:5432"

  redis:
    image: redis:8-alpine
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://volleyuser:volleypass@db:5432/volleyvideos
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - SECRET_KEY=change-me-in-production
      - GOOGLE_APPLICATION_CREDENTIALS=/app/voley-474111-a4a6b029e20b.json
      - OLLAMA_HOST=http://192.168.0.16:11434
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://volleyuser:volleypass@db:5432/volleyvideos
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - SECRET_KEY=change-me-in-production
      - GOOGLE_APPLICATION_CREDENTIALS=/app/voley-474111-a4a6b029e20b.json
    depends_on:
      - db
      - redis
      - web

  celery-beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://volleyuser:volleypass@db:5432/volleyvideos
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - SECRET_KEY=change-me-in-production
      - GOOGLE_APPLICATION_CREDENTIALS=/app/voley-474111-a4a6b029e20b.json
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data:
  chroma_data: