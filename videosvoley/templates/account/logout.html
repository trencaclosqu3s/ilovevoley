{% extends 'base.html' %}

{% block title %}Cerrar Sesión{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-md p-8 text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">¿Cerrar sesión?</h2>
        
        <p class="text-gray-600 mb-8">¿Estás seguro de que quieres salir?</p>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg font-semibold transition">
                Sí, cerrar sesión
            </button>
            <a href="{% url 'video_list' %}" class="block w-full bg-csj-purple hover:bg-csj-purple-dark text-white py-2 rounded-lg font-semibold transition">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
