[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
testpaths = ilovevoley
# El esquema de test sale de los modelos: aplicar la cadena de migraciones
# en cada worker costaba la mitad de la suite (#679). CI comprueba aparte
# que las migraciones se aplican (paso «Las migraciones se aplican»).
addopts = --strict-markers --nomigrations
