name: CI / CD

on:
  push:
    branches: [main, 'refactor/**', 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Tests & Comprobaciones
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: volleyvideos
          POSTGRES_USER: volleyuser
          POSTGRES_PASSWORD: volleypass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql

    env:
      SECRET_KEY: clave-solo-para-ci
      DEBUG: 'True'
      DB_HOST: localhost
      DB_NAME: volleyvideos
      DB_USER: volleyuser
      DB_PASSWORD: volleypass

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detección de secretos con Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-dev libde265-dev pkg-config

      - name: Instalar dependencias Python
        run: pip install -r requirements-dev.txt

      - name: Auditoría de vulnerabilidades en dependencias
        run: pip-audit -r requirements.txt

      - name: Análisis estático de seguridad con Bandit
        run: bandit -r config ilovevoley -x '*/tests/*' -ll

      - name: Comprobaciones de Django
        run: python manage.py check

      - name: Verificación de configuración de despliegue
        env:
          DEBUG: 'False'
          SECRET_KEY: django-ci-deploy-check-secret-key-with-50-characters-and-high-entropy
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check --deploy

      - name: No debe haber migraciones pendientes de generar
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python -m pytest --create-db -v

  deploy:
    name: Despliegue en Producción
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en servidor vía SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            ./deploy.sh
