    # =========================================================
    # jellyfin.iramnitram.ovh
    # =========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name jellyfin.iramnitram.ovh;

        ssl_certificate /etc/letsencrypt/live/iramnitram.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iramnitram.ovh/privkey.pem;

        location ~* \.(php|env|ini|log|conf)$               { return 444; }
        location ~* /\.env                                   { return 444; }
        location ~* /(wp-admin|wp-login|wp-content|wp-includes) { return 444; }
        if ($bad_uri)                                        { return 444; }

        # Necesario para Jellyfin: websockets
        location / {
            set $up_jellyfin jellyfin:8096;
            proxy_pass http://$up_jellyfin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }

