events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Filtro de logs: ignorar basura conocida de bots
    map $request_uri $loggable {
        default             1;
        ~*\.php$            0;
        ~*wp-admin          0;
        ~*wp-login          0;
        ~*wp-content        0;
        ~*wp-includes       0;
        ~*\.(env|envrc|ini|log|conf)$  0;
        "~*^[^?]*%00"       0;
        "~*^[^?]*%2f"       0;
        "~*^[^?]*%252f"     0;
    }

    # Bloquear URIs con null bytes o path encoding malicioso
    # Solo en el path (antes del ?), no en query params (OAuth callbacks usan %2F legítimamente)
    map $request_uri $bad_uri {
        default          0;
        "~*^[^?]*%00"   1;
        "~*^[^?]*%2f"   1;
        "~*^[^?]*%252f" 1;
    }

    access_log /var/log/nginx/access.log combined if=$loggable;

    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    upstream django {
        server web:8000;
    }

    # =========================================================
    # Catch-all: bloquear acceso directo por IP
    # =========================================================
    server {
        listen 80  default_server;
        listen 443 ssl default_server;

        ssl_certificate     /etc/letsencrypt/live/iramnitram.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iramnitram.ovh/privkey.pem;

        return 444;
    }

    # =========================================================
    # ilovevoley.es — HTTP → HTTPS
    # =========================================================
    server {
        listen 80;
        server_name ilovevoley.es www.ilovevoley.es;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ilovevoley.es — HTTPS
    server {
        listen 443 ssl;
        server_name ilovevoley.es www.ilovevoley.es;
        client_max_body_size 100M;

        ssl_certificate /etc/letsencrypt/live/ilovevoley.es/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ilovevoley.es/privkey.pem;

        location ~* \.(php|env|ini|log|conf)$               { return 444; }
        location ~* /\.env                                   { return 444; }
        location ~* /(wp-admin|wp-login|wp-content|wp-includes) { return 444; }
        if ($bad_uri)                                        { return 444; }

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        location /accounts/login/ {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=general burst=10 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================
    # films.iramnitram.ovh — HTTP → HTTPS
    # =========================================================
    server {
        listen 80;
        server_name films.iramnitram.ovh;

        location /.well-known/acme-challenge/ {
