        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # films.iramnitram.ovh — HTTPS (app completa)
    server {
        listen 443 ssl;
        server_name films.iramnitram.ovh;

        ssl_certificate /etc/letsencrypt/live/iramnitram.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iramnitram.ovh/privkey.pem;

        location ~* \.(php|env|ini|log|conf)$               { return 444; }
        location ~* /\.env                                   { return 444; }
        location ~* /(wp-admin|wp-login|wp-content|wp-includes) { return 444; }
        if ($bad_uri)                                        { return 444; }

        location /static/ {
            alias /opt/film-hub/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /accounts/login/ {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://film-hub-web-1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://film-hub-web-1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================
    # iramnitram.ovh — HTTPS (dashboard de servicios)
    # =========================================================
    server {
        listen 443 ssl;
        server_name iramnitram.ovh;

        ssl_certificate /etc/letsencrypt/live/iramnitram.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iramnitram.ovh/privkey.pem;

        location ~* \.(php|env|ini|log|conf)$               { return 444; }
        location ~* /\.env                                   { return 444; }
        location ~* /(wp-admin|wp-login|wp-content|wp-includes) { return 444; }
        if ($bad_uri)                                        { return 444; }

        # Redirige la raíz al dashboard de servicios
        location = / {
            return 301 https://$host/servicios/;
        }

        # Estáticos servidos por WhiteNoise (nginx no tiene acceso al volumen de film-hub)
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://film-hub-web-1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================
    # iramnitram.ovh — arr stack
    # HTTP → HTTPS (wildcard para todos los subdominios)
    # =========================================================
    server {
        listen 80;
        server_name iramnitram.ovh *.iramnitram.ovh;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================
    # jellyfin.iramnitram.ovh
    # =========================================================
    server {
        listen 443 ssl;
        server_name jellyfin.iramnitram.ovh;

        ssl_certificate /etc/letsencrypt/live/iramnitram.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iramnitram.ovh/privkey.pem;

        location ~* \.(php|env|ini|log|conf)$               { return 444; }
        location ~* /\.env                                   { return 444; }
        location ~* /(wp-admin|wp-login|wp-content|wp-includes) { return 444; }
        if ($bad_uri)                                        { return 444; }

        # Necesario para Jellyfin: websockets
        location / {
            proxy_pass http://jellyfin:8096;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }

