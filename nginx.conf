        }
    }

    # =========================================================
    # iramnitram.ovh — HTTPS (dashboard de servicios)
    # =========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name iramnitram.ovh;

        ssl_certificate /etc/letsencrypt/live/iramnitram.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iramnitram.ovh/privkey.pem;

        location ~* \.(php|env|ini|log|conf)$               { return 444; }
        location ~* /\.env                                   { return 444; }
        location ~* /(wp-admin|wp-login|wp-content|wp-includes) { return 444; }
        if ($bad_uri)                                        { return 444; }

        # Redirige la raíz al dashboard de servicios
        location = / {
            return 301 https://$host/servicios/;
        }

        # Estáticos servidos por WhiteNoise (nginx no tiene acceso al volumen de film-hub)
        location / {
            set $up_dashboard film-hub-web-1:8000;
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://$up_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================
    # iramnitram.ovh — arr stack
    # HTTP → HTTPS (wildcard para todos los subdominios)
    # =========================================================
    server {
        listen 80;
        server_name iramnitram.ovh *.iramnitram.ovh;

        location /.well-known/acme-challenge/ {
