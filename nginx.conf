events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Filtro de logs: ignorar basura conocida de bots
    map $request_uri $loggable {
        default             1;
        ~*\.php$            0;
        ~*wp-admin          0;
        ~*wp-login          0;
        ~*wp-content        0;
        ~*wp-includes       0;
        ~*\.(env|envrc|ini|log|conf)$  0;
        "~*^[^?]*%00"       0;
        "~*^[^?]*%2f"       0;
        "~*^[^?]*%252f"     0;
    }

    # Bloquear URIs con null bytes o path encoding malicioso
    # (nombre usado también por los vhosts de nginx-extra/: no renombrar)
    # Solo en el path (antes del ?), no en query params (OAuth callbacks usan %2F legítimamente)
    map $request_uri $bad_uri {
        default          0;
        "~*^[^?]*%00"   1;
        "~*^[^?]*%2f"   1;
        "~*^[^?]*%252f" 1;
    }

    access_log /var/log/nginx/access.log combined if=$loggable;

    server_tokens off;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    gzip_min_length 256;

    # HTTP/2
    http2 on;

    # Rate limiting zones
    # (general y login se usan también desde nginx-extra/: no renombrar)
    limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Por defecto nginx responde 503 al superar el límite, lo que se confunde con
    # un backend caído. 429 deja claro que es rate limiting, no una avería.
    limit_req_status 429;

    # Usar el DNS interno de Docker para re-resolver IPs cuando los contenedores se recrean
    #
    # IMPORTANTE: todos los proxy_pass de este archivo usan una VARIABLE
    # (set $foo host:puerto; proxy_pass http://$foo;) en lugar del hostname
    # literal. Con hostname literal nginx resuelve el DNS AL ARRANCAR y si el
    # contenedor no existe aborta con [emerg] y no levanta NADA. Con variable,
    # la resolución se hace en cada petición contra este resolver: si el
    # contenedor está parado, ese subdominio da 502 y el resto sigue vivo.
    # También lo heredan los vhosts de nginx-extra/.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =========================================================
    # Catch-all: bloquear acceso directo por IP
    # =========================================================
    server {
        listen 80  default_server;
        listen 443 ssl default_server;
        http2 on;

        ssl_certificate     /etc/letsencrypt/live/ilovevoley.es-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ilovevoley.es-0001/privkey.pem;

        return 444;
    }

    # =========================================================
    # www.ilovevoley.es → ilovevoley.es (HTTP y HTTPS)
    # =========================================================
    server {
        listen 80;
        server_name www.ilovevoley.es;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://ilovevoley.es$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.ilovevoley.es;

        ssl_certificate /etc/letsencrypt/live/ilovevoley.es-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ilovevoley.es-0001/privkey.pem;

        return 301 https://ilovevoley.es$request_uri;
    }

    # =========================================================
    # ilovevoley.es — HTTP → HTTPS
    # =========================================================
    server {
        listen 80;
        server_name ilovevoley.es *.ilovevoley.es;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ilovevoley.es — HTTPS (wildcard cert cubre *.ilovevoley.es)
    # Para obtener el cert wildcard en producción:
    #   pip install certbot-dns-ovh
    #   certbot certonly --dns-ovh --dns-ovh-credentials ~/ovh.ini \
    #     -d ilovevoley.es -d '*.ilovevoley.es'
    server {
        listen 443 ssl;
        http2 on;
        server_name ilovevoley.es *.ilovevoley.es;
        client_max_body_size 60M;

        ssl_certificate /etc/letsencrypt/live/ilovevoley.es-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ilovevoley.es-0001/privkey.pem;

        location ~* \.(php|env|ini|log|conf)$               { return 444; }
        location ~* /\.env                                   { return 444; }
        location ~* /(wp-admin|wp-login|wp-content|wp-includes) { return 444; }
        if ($bad_uri)                                        { return 444; }

        # Errores servidos desde /static/: no pasan por el backend, así que
        # funcionan aunque gunicorn esté saturado o caído. La página de 429
        # evita que el rate limit se confunda con una avería.
        error_page 429 /static/errors/429.html;
        error_page 502 503 504 /static/errors/503.html;

        location /static/ {
            alias /app/staticfiles/;
            add_header Cache-Control "public, max-age=3600, must-revalidate";

            # Archivos versionados con hash por ManifestStaticFilesStorage (12 caracteres hex)
            location ~* "^/static/(.+\.[0-9a-f]{12}\..+)$" {
                alias /app/staticfiles/$1;
                add_header Cache-Control "public, max-age=2592000, immutable";
            }
        }

        # Recursos públicos: logos de organizaciones, escudos de clubes/equipos y avatares del perfil.
        # Se sirven estáticos sin pasar por Django.
        location ^~ /media/organizations/ {
            alias /app/media/organizations/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;
        }

        location ^~ /media/avatars/ {
            alias /app/media/avatars/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;
        }

        location ^~ /media/clubs/ {
            alias /app/media/clubs/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;
        }

        location ^~ /media/teams/ {
            alias /app/media/teams/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;
        }

        # Resto de /media/ (imágenes y fichas de personas): la autorización la
        # decide Django, que responde con X-Accel-Redirect si el acceso es válido.
        # El modificador ^~ garantiza que ninguna regex posterior lo capture y
        # sirva el archivo en disco saltándose la autorización.
        location ^~ /media/ {
            set $up_media web:8000;
            proxy_pass http://$up_media;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Zona interna de entrega: solo accesible por redirección X-Accel-Redirect
        # desde Django, nunca directamente desde el cliente.
        location ^~ /protected-media/ {
            internal;
            alias /app/media/;
        }

        location /accounts/login/ {
            set $up_voley web:8000;
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://$up_voley;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $up_voley web:8000;
            limit_req zone=general burst=10 nodelay;
            proxy_pass http://$up_voley;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================
    # Vhosts adicionales: viven fuera del repo (#117).
    # Si el directorio está vacío el include no falla.
    # =========================================================
    include /etc/nginx/extra/*.conf;
}
